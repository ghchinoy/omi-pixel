name: CI & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-service:
    name: Go Backend (vet, race tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -race -v ./...

      - name: Build Binary
        run: go build -o /dev/null .

  flutter-android:
    name: Flutter Companion (analyze, test, release APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: flutter test

      - name: Decode optional Android release signing & Firebase secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64}" ] && [ -n "${ANDROID_KEY_PROPERTIES}" ]; then
            echo "${ANDROID_KEYSTORE_B64}" | base64 -d > android/release.keystore
            printf "%s\n" "${ANDROID_KEY_PROPERTIES}" > android/key.properties
            echo "✓ Configured release keystore signing from secrets"
          else
            echo "ℹ No release keystore secrets set — building with debug signing"
          fi
          if [ -n "${GOOGLE_SERVICES_JSON_B64}" ]; then
            echo "${GOOGLE_SERVICES_JSON_B64}" | base64 -d > android/app/google-services.json
            echo "✓ Decoded google-services.json from secrets"
          else
            echo "ℹ No google-services.json secret — building universal APK (uses runtime GET /api/client-config)"
          fi

      - name: Build release APK
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          DART_DEFINES=""
          if [ -n "${FIREBASE_PROJECT_ID}" ] && [ -n "${FIREBASE_ANDROID_API_KEY}" ] && [ -n "${FIREBASE_ANDROID_APP_ID}" ]; then
            DART_DEFINES="--dart-define=FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID} --dart-define=FIREBASE_API_KEY=${FIREBASE_ANDROID_API_KEY} --dart-define=FIREBASE_APP_ID=${FIREBASE_ANDROID_APP_ID} --dart-define=FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}"
          fi
          flutter build apk --release ${DART_DEFINES}

      - name: Prepare versioned APK & SHA-256 checksum
        id: apk
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_SHA::7}"
          fi
          APK_NAME="omi-pixel-${TAG_NAME}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${APK_NAME}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> "${GITHUB_OUTPUT}"
          cat "${APK_NAME}.sha256"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: |
            app/${{ steps.apk.outputs.apk_name }}
            app/${{ steps.apk.outputs.apk_name }}.sha256
          retention-days: 14

      - name: Attach APK to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.apk.outputs.apk_name }}" \
            "${{ steps.apk.outputs.apk_name }}.sha256" \
            --clobber
